name: proofline-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: proofline
      POSTGRES_USER: proofline
      POSTGRES_PASSWORD: proofline_local_only
    ports:
      - "55432:5432"
    volumes:
      - proofline_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofline -d proofline"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "58025:8025"
      - "51025:1025"

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile.dev
    ports:
      - "58100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["files"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proofline
      MINIO_ROOT_PASSWORD: proofline_local_secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - proofline_minio:/data

volumes:
  proofline_postgres:
  proofline_minio:
