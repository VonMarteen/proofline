name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --no-frozen-lockfile --reporter=append-only
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm build
      - name: Python syntax
        run: python -m compileall services/analytics/app
